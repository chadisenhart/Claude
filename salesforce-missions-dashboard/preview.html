<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Missions Dashboard — Preview</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f3f6fa;font-size:14px}

/* ── Header ── */
.md-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
  background:#fff;padding:12px 20px;border-bottom:2px solid #e0e8f0;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.md-header-left{display:flex;align-items:center;gap:12px}
.md-globe{width:48px;height:48px;flex-shrink:0}
.md-title-main{font-size:1.25rem;font-weight:700;color:#1b4e8c;line-height:1.2}
.md-title-sub{font-size:.85rem;color:#6b7c93}
.md-stat-row{display:flex;gap:24px;flex-wrap:wrap}
.md-stat{display:flex;flex-direction:column;align-items:center;min-width:72px}
.md-stat-val{font-size:1.5rem;font-weight:700;color:#1b4e8c;line-height:1.1}
.md-stat-lbl{font-size:.68rem;color:#6b7c93;text-transform:uppercase;letter-spacing:.5px}

/* ── Filters ── */
.md-filters{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;
  background:#fff;padding:10px 20px 12px;border-bottom:1px solid #dde4ee}
.md-filter-item{display:flex;flex-direction:column;gap:3px}
.md-filter-item label{font-size:.72rem;font-weight:600;color:#3e3e3c}
.md-filter-item select,.md-filter-item input{
  border:1px solid #ccc;border-radius:4px;padding:5px 8px;font-size:.82rem;
  background:#fff;height:32px;min-width:160px}

/* ── Body ── */
.md-body{display:flex;flex-direction:column;gap:14px;padding:14px 16px}

/* ── Section label ── */
.md-section-lbl{font-size:.72rem;font-weight:700;color:#3e3e3c;
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.md-filter-badge{background:#1b6cb5;color:#fff;font-size:.65rem;
  padding:1px 6px;border-radius:8px;font-weight:600;text-transform:none;letter-spacing:0}

/* ── Map ── */
.md-map-wrap{border:1px solid #ccd4e0;border-radius:6px;overflow:hidden;background:#d6e8f5;position:relative}
#md-map{height:340px;width:100%}
.md-map-legend{position:absolute;bottom:8px;left:8px;z-index:1000;
  background:rgba(255,255,255,.9);padding:5px 10px;border-radius:4px;
  font-size:.7rem;color:#333;border:1px solid #ddd;display:flex;gap:10px;align-items:center}
.leg-item{display:flex;align-items:center;gap:4px}
.leg-dot{display:inline-block;width:11px;height:11px;border-radius:50%;border:1.5px solid rgba(255,255,255,.8)}

/* ── Table ── */
.md-table-wrap{max-height:460px;overflow-y:auto;border:1px solid #ccd4e0;border-radius:6px;background:#fff}
table.md-tbl{width:100%;border-collapse:collapse;font-size:.78rem}
.md-tbl thead th{background:#f0f4fa;color:#2c3e50;font-weight:700;padding:7px 10px;
  text-align:left;border-bottom:2px solid #dde4ee;white-space:nowrap;position:sticky;top:0;z-index:1}
.md-tbl thead th.num{text-align:right}
.md-tbl tbody tr:nth-child(even){background:#f8fafd}
.md-tbl tbody tr:hover{background:#eaf2ff}
.md-tbl td{padding:6px 10px;border-bottom:1px solid #f0f0f0;color:#1a1a1a;vertical-align:middle}
.md-tbl td.num{text-align:right;color:#444}
.md-tbl td.name-cell a{color:#1b6cb5;text-decoration:none;font-weight:600}
.md-tbl td.name-cell a:hover{text-decoration:underline}
.md-tbl tfoot td{background:#f0f4fa;font-weight:700;font-size:.72rem;padding:7px 10px;color:#333}
.md-tbl tfoot td.num{text-align:right}

/* ── Badges ── */
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.68rem;font-weight:700;color:#fff}
.st-active   {background:#27ae60}
.st-home     {background:#f39c12}
.st-candidate{background:#2980b9}
.st-hold     {background:#95a5a6}

/* ── Country chips in popup ── */
.pop-title{font-weight:700;font-size:.82rem;margin-bottom:3px}
.pop-sub{font-size:.72rem;color:#555;margin-bottom:4px}
.pop-names{font-size:.7rem;color:#333;line-height:1.5}
</style>
</head>
<body>

<!-- ── Header ── -->
<div class="md-header">
  <div class="md-header-left">
    <svg class="md-globe" viewBox="0 0 48 48" fill="none">
      <circle cx="24" cy="24" r="22" stroke="#1b6cb5" stroke-width="2.5" fill="#e8f4fd"/>
      <ellipse cx="24" cy="24" rx="10" ry="22" stroke="#1b6cb5" stroke-width="1.5" fill="none"/>
      <line x1="2" y1="24" x2="46" y2="24" stroke="#1b6cb5" stroke-width="1.5"/>
      <line x1="2" y1="17" x2="46" y2="17" stroke="#1b6cb5" stroke-width="1"/>
      <line x1="2" y1="31" x2="46" y2="31" stroke="#1b6cb5" stroke-width="1"/>
    </svg>
    <div>
      <div class="md-title-main">Missions Dashboard</div>
      <div class="md-title-sub">Missionary Deployment &amp; Support Overview</div>
    </div>
  </div>
  <div class="md-stat-row">
    <div class="md-stat"><span class="md-stat-val" id="stat-total">—</span><span class="md-stat-lbl">Missionaries</span></div>
    <div class="md-stat"><span class="md-stat-val" id="stat-active">—</span><span class="md-stat-lbl">Active</span></div>
    <div class="md-stat"><span class="md-stat-val" id="stat-countries">—</span><span class="md-stat-lbl">Countries</span></div>
    <div class="md-stat"><span class="md-stat-val" id="stat-support">—</span><span class="md-stat-lbl">Total Support</span></div>
  </div>
</div>

<!-- ── Filters ── -->
<div class="md-filters">
  <div class="md-filter-item">
    <label>Region</label>
    <select id="filter-region" onchange="applyFilters()">
      <option value="All">All Regions</option>
      <option value="Africa">Africa</option>
      <option value="Asia Pacific">Asia Pacific</option>
      <option value="Europe">Europe</option>
      <option value="Latin America">Latin America</option>
      <option value="Middle East">Middle East</option>
      <option value="North America">North America</option>
    </select>
  </div>
  <div class="md-filter-item">
    <label>Status</label>
    <select id="filter-status" onchange="applyFilters()">
      <option value="All">All Statuses</option>
      <option value="Active">Active</option>
      <option value="Home Assignment">Home Assignment</option>
      <option value="Candidate">Candidate</option>
      <option value="On Hold">On Hold</option>
    </select>
  </div>
  <div class="md-filter-item">
    <label>Search</label>
    <input type="text" id="filter-search" placeholder="Name or country…" oninput="applyFilters()"/>
  </div>
</div>

<!-- ── Body ── -->
<div class="md-body">

  <!-- Map -->
  <div>
    <div class="md-section-lbl">World Deployment Map</div>
    <div class="md-map-wrap">
      <div id="md-map"></div>
      <div class="md-map-legend">
        <div class="leg-item"><span class="leg-dot" style="background:#27ae60"></span> Active</div>
        <div class="leg-item"><span class="leg-dot" style="background:#f39c12"></span> Home Assignment</div>
        <div class="leg-item"><span class="leg-dot" style="background:#2980b9"></span> Candidate</div>
        <div class="leg-item"><span class="leg-dot" style="background:#95a5a6"></span> On Hold</div>
      </div>
    </div>
  </div>

  <!-- Table -->
  <div>
    <div class="md-section-lbl">Missionaries (<span id="tbl-count">—</span>)</div>
    <div class="md-table-wrap">
      <table class="md-tbl">
        <thead>
          <tr>
            <th>Name</th>
            <th>Country</th>
            <th>Region</th>
            <th>City</th>
            <th>Status</th>
            <th>Organization</th>
            <th class="num">Support Raised</th>
            <th class="num">Gifts</th>
          </tr>
        </thead>
        <tbody id="tbl-body"></tbody>
        <tfoot>
          <tr>
            <td colspan="6">Totals</td>
            <td class="num" id="tbl-total-support">—</td>
            <td class="num" id="tbl-total-gifts">—</td>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>

</div>

<script>
// ── Mock data ─────────────────────────────────────────────────────────────────
const STATUS_COLOR = {

  'Home Assignment': '#f39c12',
  'Candidate':       '#2980b9',
  'On Hold':         '#95a5a6',

const STATUS_CLASS = {
  'Active':          'st-active',
  'Home Assignment': 'st-home',
  'Candidate':       'st-candidate',
  'On Hold':         'st-hold',
};

const MISSIONARIES = [
  // Africa
  {id:'001',name:'David & Sarah Okafor',country:'Nigeria',city:'Lagos',region:'Africa',lat:6.5244,lng:3.3792,status:'Active',org:'FMI Africa',giving:84200,gifts:312},

  {id:'005',name:'Miriam Dlamini',country:'South Africa',city:'Johannesburg',region:'Africa',lat:-26.2041,lng:28.0473,status:'Active',org:'FMI Africa',giving:47300,gifts:178},

  // Asia Pacific
  {id:'007',name:'Mark & Lisa Tanaka',country:'Japan',city:'Tokyo',region:'Asia Pacific',lat:35.6762,lng:139.6503,status:'Active',org:'FMI Asia',giving:103400,gifts:389},
  {id:'008',name:'Steve & Amy Chen',country:'Taiwan',city:'Taipei',region:'Asia Pacific',lat:25.0330,lng:121.5654,status:'Active',org:'FMI Asia',giving:91700,gifts:342},
  {id:'009',name:'Joseph Reyes',country:'Philippines',city:'Manila',region:'Asia Pacific',lat:14.5995,lng:120.9842,status:'Active',org:'FMI Asia',giving:55600,gifts:217},
  {id:'010',name:'Rachel & Daniel Wirawan',country:'Indonesia',city:'Jakarta',region:'Asia Pacific',lat:-6.2088,lng:106.8456,status:'Active',org:'FMI Asia',giving:63200,gifts:241},
  {id:'011',name:'Peter & Hannah Kim',country:'South Korea',city:'Seoul',region:'Asia Pacific',lat:37.5665,lng:126.9780,status:'Home Assignment',org:'FMI Asia',giving:88100,gifts:319},
  {id:'012',name:'Andrew Supakit',country:'Thailand',city:'Bangkok',region:'Asia Pacific',lat:13.7563,lng:100.5018,status:'Active',org:'FMI Asia',giving:49800,gifts:186},
  {id:'013',name:'Naomi & Chris Aung',country:'Myanmar',city:'Yangon',region:'Asia Pacific',lat:16.8661,lng:96.1951,status:'On Hold',org:'FMI Asia',giving:34200,gifts:131},

  // Europe
  {id:'014',name:'Michael & Petra Braun',country:'Germany',city:'Berlin',region:'Europe',lat:52.5200,lng:13.4050,status:'Active',org:'FMI Europe',giving:96300,gifts:361},
  {id:'015',name:'Ivan & Oksana Kovalenko',country:'Ukraine',city:'Kyiv',region:'Europe',lat:50.4501,lng:30.5234,status:'Active',org:'FMI Europe',giving:74800,gifts:293},
  {id:'016',name:'Aleksei Volkov',country:'Russia',city:'Moscow',region:'Europe',lat:55.7558,lng:37.6173,status:'On Hold',org:'FMI Europe',giving:28900,gifts:89},
  {id:'017',name:'Carlos & Maria Fernandez',country:'Spain',city:'Madrid',region:'Europe',lat:40.4168,lng:-3.7038,status:'Active',org:'FMI Europe',giving:67400,gifts:258},

  {id:'019',name:'Roberto & Ana Lima',country:'Brazil',city:'Brasília',region:'Latin America',lat:-15.7797,lng:-47.9297,status:'Active',org:'FMI LatAm',giving:81600,gifts:308},

  // Middle East

  {id:'025',name:'Elias & Hana Khoury',country:'Lebanon',city:'Beirut',region:'Middle East',lat:33.8938,lng:35.5018,status:'On Hold',org:'FMI Middle East',giving:31400,gifts:119},
  {id:'026',name:'Yusuf & Maryam Demir',country:'Turkey',city:'Istanbul',region:'Middle East',lat:41.0082,lng:28.9784,status:'Active',org:'FMI Middle East',giving:62100,gifts:236},
  {id:'027',name:'Karim & Layla Nasser',country:'Jordan',city:'Amman',region:'Middle East',lat:31.9539,lng:35.9106,status:'Candidate',org:'FMI Middle East',giving:16800,gifts:64},

  // North America
  {id:'028',name:'Samuel & Abby Beaumont',country:'Canada',city:'Toronto',region:'North America',lat:43.6532,lng:-79.3832,status:'Active',org:'FMI NA',giving:112400,gifts:421},
  {id:'029',name:'Ben & Laura Kingsford',country:'United States',city:'Chicago',region:'North America',lat:41.8781,lng:-87.6298,status:'Home Assignment',org:'FMI NA',giving:98700,gifts:374},
];

// ── Aggregate by country ───────────────────────────────────────────────────────
function buildCountries(data) {
  const map = {};
  data.forEach(m => {
    if (!map[m.country]) map[m.country] = {country:m.country,region:m.region,lat:m.lat,lng:m.lng,names:[],count:0,activeCount:0,giving:0,statusCounts:{}};
    const c = map[m.country];
    c.names.push(m.name);
    c.count++;
    c.giving += m.giving;
    if (m.status === 'Active') c.activeCount++;
    c.statusCounts[m.status] = (c.statusCounts[m.status]||0) + 1;
  });
  return Object.values(map);
}

function dominantStatus(c) {
  if (c.activeCount > 0) return 'Active';
  const order = ['Home Assignment','Candidate','On Hold'];
  for (const s of order) if ((c.statusCounts[s]||0) > 0) return s;
  return 'On Hold';
}

// ── Number formatting ──────────────────────────────────────────────────────────
const fmtUSD = v => '$' + (v >= 1e6 ? (v/1e6).toFixed(1)+'M' : v >= 1e3 ? (v/1e3).toFixed(0)+'K' : v);
const fmtFull = v => '$' + v.toLocaleString('en-US');

// ── Map ────────────────────────────────────────────────────────────────────────
let leafletMap = null;
let markerLayer = null;

function initMap() {
  leafletMap = L.map('md-map', {scrollWheelZoom:false}).setView([20,10],2);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'© OpenStreetMap contributors',maxZoom:10
  }).addTo(leafletMap);
  markerLayer = L.layerGroup().addTo(leafletMap);
}

function renderMapMarkers(countries) {
  markerLayer.clearLayers();
  countries.forEach(c => {
    const status = dominantStatus(c);
    const color  = STATUS_COLOR[status];
    const radius = Math.max(9, Math.min(c.count * 6, 32));
    const names  = c.names.slice(0,5).join('<br>') + (c.names.length > 5 ? `<br><em>+${c.names.length-5} more</em>` : '');
    const circle = L.circleMarker([c.lat,c.lng],{
      radius, fillColor:color, color:'#fff', weight:2, opacity:1, fillOpacity:.85
    }).addTo(markerLayer);
    circle.bindPopup(
      `<div class="pop-title">${c.country}</div>` +
      `<div class="pop-sub">${c.count} missionary(ies) &middot; ${c.activeCount} active &middot; ${fmtUSD(c.giving)} raised</div>` +
      `<div class="pop-names">${names}</div>`
    );
  });
}

// ── Table ─────────────────────────────────────────────────────────────────────
function renderTable(data) {
  const tbody = document.getElementById('tbl-body');
  tbody.innerHTML = '';
  let totalGiving = 0, totalGifts = 0;
  data.forEach(m => {
    totalGiving += m.giving;
    totalGifts  += m.gifts;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="name-cell"><a href="#" onclick="return false">${m.name}</a></td>
      <td>${m.country}</td>
      <td>${m.region}</td>
      <td>${m.city}</td>
      <td><span class="badge ${STATUS_CLASS[m.status]}">${m.status}</span></td>
      <td>${m.org}</td>
      <td class="num">${fmtFull(m.giving)}</td>
      <td class="num">${m.gifts.toLocaleString()}</td>
    `;
    tbody.appendChild(tr);
  });
  document.getElementById('tbl-count').textContent = data.length;
  document.getElementById('tbl-total-support').textContent = fmtFull(totalGiving);
  document.getElementById('tbl-total-gifts').textContent = totalGifts.toLocaleString();
}

// ── Stats bar ─────────────────────────────────────────────────────────────────
function renderStats(data) {
  const active = data.filter(m => m.status === 'Active').length;
  const countries = new Set(data.map(m => m.country)).size;
  const total = data.reduce((s,m) => s + m.giving, 0);
  document.getElementById('stat-total').textContent     = data.length;
  document.getElementById('stat-active').textContent    = active;
  document.getElementById('stat-countries').textContent = countries;
  document.getElementById('stat-support').textContent   = fmtUSD(total);
}

// ── Filters ───────────────────────────────────────────────────────────────────
function applyFilters() {
  const region = document.getElementById('filter-region').value;
  const status = document.getElementById('filter-status').value;
  const search = document.getElementById('filter-search').value.toLowerCase();

  const filtered = MISSIONARIES.filter(m => {
    if (region !== 'All' && m.region !== region) return false;
    if (status !== 'All' && m.status !== status) return false;
    if (search && !m.name.toLowerCase().includes(search) && !m.country.toLowerCase().includes(search)) return false;
    return true;
  });

  renderStats(filtered);
  renderTable(filtered);
  renderMapMarkers(buildCountries(filtered));
}

// ── Boot ──────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  initMap();
  applyFilters();
});
</script>
</body>
</html>
